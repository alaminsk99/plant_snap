name: plant_snap
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1


  google_fonts: any
  image_picker: any
  http: any
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.4.1
  get: ^4.6.6
  firebase_storage: ^12.4.1
  timeago: ^3.7.0
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.10
  iconsax: ^0.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^4.0.0
  http: ^1.3.0
  image_picker: ^1.1.2

flutter:


