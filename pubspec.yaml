name: plant_snap
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter

  #Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  #firebase
  firebase_core: ^3.10.1
  firebase_storage: ^12.4.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2


  #Utility Package
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  lottie: ^2.7.0
  connectivity_plus: ^6.1.2
  google_fonts: any
  image_picker: any
  http: any
  timeago: ^3.7.0
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.10


  #State Management
  get: ^4.6.6
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.3"
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/PlantSnap-Logo.png"
  min_sdk_android: 21

  flutter_lints: ^4.0.0
  http: ^1.3.0
  image_picker: ^1.1.2

flutter:


  uses-material-design: true

  #images
  assets:
    - assets/images/
    - assets/logos/
    - assets/animation/
    - assets/logos/PlantSnap-Logo.png


  #fonts

